name: Publish Package to Nuget

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
      runs-on: ubuntu-latest
  
      permissions:
        id-token: write 
      environment: production
        
      steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x

      # Install the released tool from nuget.org (no CI-local pack) and put its shim on PATH
      - name: Install ReleaseGen from nuget.org
        run: |
          dotnet tool install -g ReleaseGen
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      # Stage stack - run at the repository root, where releasegen.json sits; the stages hand
      # off to each other through the release/ tree (docs/stage-handoff.md)
      - name: Build
        run: releasegen build

      - name: Test
        run: releasegen test

      - name: Package
        run: releasegen package

      # Authenticate to NuGet (OIDC)
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      # Publish - no switch: CI skip intent lives in the committed manifest (skipDuplicates),
      # and the key arrives via NUGET_API_KEY, never on argv
      - name: Publish
        run: releasegen publish
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
